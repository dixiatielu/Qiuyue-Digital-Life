/* Presentation refinements after desktop and narrow-screen inspection. */
.shell{background:linear-gradient(90deg,var(--side-bg) 220px,var(--bg) 220px)}
.brand small{font-size:8px;letter-spacing:1.45px;white-space:nowrap}
.sidehealth .muted{font-size:11px}

/* Theme controls are prototype-only; the accent travels in the preview URL. */
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.switch input:checked+span{background:var(--accent-ink)}
.theme-trigger{padding:7px 11px;font-size:12px;gap:8px}
.theme-chip{width:14px;height:14px;border-radius:50%;background:var(--accent);border:1px solid #0002;display:inline-block;flex-shrink:0}
.theme-back{justify-content:flex-end;padding:16px;background:#16213212;backdrop-filter:none}
.theme-panel{width:370px;max-height:calc(100dvh - 32px);padding:24px;box-shadow:0 18px 70px #17233d26}
.theme-panel .content{margin:24px 0}
.theme-panel h3{font-size:12px;margin:0 0 12px}
.theme-panel .intro{font-size:12px;color:var(--muted);margin-bottom:22px}
.theme-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.theme-preset{display:flex;flex-direction:column;gap:9px;padding:13px 8px;font-size:11px;border-color:var(--line)}
.theme-preset[aria-pressed=true]{background:var(--soft);border-color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent-ink)}
.theme-swatch{width:26px;height:26px;border-radius:50%;background:var(--swatch);border:1px solid #0001;display:grid;place-items:center;color:var(--swatch-text);font-size:14px}
.theme-preset[aria-pressed=false] .theme-swatch>span{visibility:hidden}
.theme-custom{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
input.theme-picker[type=color]{width:48px;height:43px;padding:4px;cursor:pointer;background:var(--panel)}
.theme-example{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--field);margin-top:18px}
.theme-example .row{font-size:11px;gap:6px}
.theme-error{font-size:11px;color:var(--red);min-height:20px;margin-top:6px;line-height:1.8}
.theme-hint{font-size:11px;color:var(--muted);line-height:1.8;margin-top:17px}
.theme-panel [aria-invalid=true]{border-color:var(--red)}

 const picker=document.getElementById('theme-picker');if(picker)picker.value=currentAccent;
 const input=document.getElementById('theme-hex');if(input&&document.activeElement!==input)input.value=currentAccent;
 const label=document.getElementById('theme-current');if(label)label.textContent=(themePresets.find(p=>p[1]===currentAccent)?.[0]||'自定义')+' · '+currentAccent;
}
function openTheme(){
 modal('主题色',`<p class="intro">选一个喜欢的颜色，整套界面立即跟着变化。</p><h3>预设配色</h3><div class="theme-presets">${themePresets.map(([name,color])=>`<button type="button" class="theme-preset" data-accent="${color}" aria-label="${name}" aria-pressed="${currentAccent===color}"><span class="theme-swatch" style="--swatch:${color};--swatch-text:${contrast(rgb(color),[255,255,255])>=4.5?'#fff':'#111827'}"><span>✓</span></span>${name}</button>`).join('')}</div><div class="divider"></div><h3><label for="theme-hex">自定义颜色</label></h3><div class="theme-custom"><input class="theme-picker" type="color" id="theme-picker" value="${currentAccent}" aria-label="选择主题颜色"><input class="mono" id="theme-hex" value="${currentAccent}" placeholder="#536FB5" spellcheck="false" autocomplete="off" maxlength="7" aria-describedby="theme-error" aria-invalid="false"></div><p class="theme-error" id="theme-error" role="status"></p><div class="theme-example"><div class="row between"><span id="theme-current" class="mono"></span><span class="theme-chip" aria-hidden="true"></span></div><div class="row between" style="margin-top:13px"><span class="small muted">导航 · 按钮 · 选中态</span><span class="primary" style="padding:7px 12px;border-radius:6px">主按钮</span></div></div><p class="theme-hint">文字明暗会自动调整。成功、警告与错误仍保留各自的提示颜色。</p><p class="theme-hint">选择会保留在当前预览链接中，切换页面或刷新后仍生效。</p>`,btn('恢复初稿配色','theme-reset','ghost')+btn('完成','close','primary'));
 document.querySelector('.modalback').classList.add('theme-back');document.querySelector('.modal').classList.add('theme-panel');syncThemeControls();
}
applyAccent(validAccent(new URL(location.href).searchParams.get('accent')||'')||originalAccent,false);

const defaults={overview:'now',config:'form',plugins:'installed',persona:'core',prompt:'edit',models:'main'};
function render(){document.getElementById('app').innerHTML=shell(({overview,config,plugins:pluginsPage,persona:personaPage,prompt:promptPage,models:modelsPage}[route])());updateDraftCount()}
function navigate(){const parts=location.hash.replace(/^#\/?/,'').split('/');route=pages.some(p=>p[0]===parts[0])?parts[0]:'overview';sub=parts[1]||defaults[route];query='';document.getElementById('toast').innerHTML='';render();window.scrollTo(0,0)}
function toast(message){document.getElementById('toast').innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').innerHTML='',4500)}
let returnFocus;
function closeModal(){document.getElementById('overlay').innerHTML='';document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus()}
function modal(title,content,actions){returnFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="row between"><h2 id="dialog-title">${title}</h2>${btn(icon('close'),'close','ghost smallbtn')}</div><div class="content">${content}</div><div class="actions">${actions||btn('知道了','close','primary')}</div></section></div>`;document.body.style.overflow='hidden';document.querySelector('.modal button')?.focus()}
function changed(){return Object.keys(drafts).filter(k=>drafts[k]!==baseline[k]&&k.startsWith(route+'.'))}
function updateDraftCount(){const e=document.getElementById('draftcount');if(e&&changed().length)e.textContent=`${changed().length} 项修改尚未保存 · 预览草稿`}
function handle(action){
if(action==='theme'){openTheme();return}
if(action==='theme-reset'){applyAccent(originalAccent);document.getElementById('theme-hex').value=currentAccent;document.getElementById('theme-hex').setAttribute('aria-invalid','false');document.getElementById('theme-error').textContent='';return}
if(action==='close'){closeModal();return}
if(action==='pause'){paused=!paused;render();toast('预览状态已切换，实际服务未操作。');return}
if(action==='life'){life=!life;render();return}
if(action==='timeline'){location.hash='/overview/timeline';return}
if(action==='prompt-preview'){location.hash='/prompt/preview';return}
if(action==='restart'){modal('重启服务',`<p class="small muted">等当前思考与记忆整理结束，再重启服务。</p><div class="divider"></div><div class="row between"><span>当前思考</span>${badge(paused?'已暂停':'正在进行',paused?'neutral':'warn')}</div><div class="row between" style="margin-top:16px"><span>记忆整理</span>${badge('空闲','neutral')}</div><div class="divider"></div><p class="small muted">最多等待 15 分钟，超时后取消。这是交互预览。</p>`,btn('取消','close','ghost')+btn('立即执行','restart-now','danger')+btn('等待空闲后重启','restart-wait','primary'));return}
if(action.startsWith('restart-')){closeModal();toast(action==='restart-wait'?'预览：已加入等待队列。没有重启实际服务。':'预览：展示立即重启的结果。没有重启实际服务。');return}
if(action.startsWith('reset:')){const k=action.slice(6);drafts[k]=baseline[k];render();return}
if(action==='discard'){Object.keys(drafts).filter(k=>k.startsWith(route+'.')).forEach(k=>drafts[k]=baseline[k]);if(route==='plugins'){Object.keys(pluginState).forEach(k=>delete pluginState[k]);Object.keys(permissionState).forEach(k=>delete permissionState[k])}render();toast('已还原本页的预览草稿。');return}
if(action==='review'){if(route==='prompt'&&(!val('prompt.text',prompt).includes('{{persona}}')||!/^<!-- current-context -->$/m.test(val('prompt.text',prompt)))){toast('请补全人格占位符与独占一行的上下文边界标记。');return}if(route==='config'&&sub==='raw'){try{JSON.parse(val('config.raw','{}'))}catch{toast('JSON 格式有误，请修改后再检查。');return}}const edits=changed();modal('检查修改',note('保存后需重启生效。人格、提示词、模型身份或工具集变化可能重新建立工作上下文。')+(edits.length?`<div class="diff">${edits.map(k=>`<span class="context">${esc(k)}</span><span class="del">− ${esc(String(baseline[k]).slice(0,300))}</span><span class="add">+ ${esc(String(drafts[k]).slice(0,300))}</span>`).join('')}</div>`:'<p class="muted small">当前没有修改。可以先编辑字段，再体验修改检查。</p>')+`<p class="subtitle">设计稿中的保存仅演示反馈，不写入项目文件。</p>`,btn('继续编辑','close','ghost')+btn('模拟保存','save','primary'));return}
if(action==='save'){changed().forEach(k=>baseline[k]=drafts[k]);closeModal();render();toast('已模拟保存。正式配置与运行状态没有变化。');return}
if(action.startsWith('version:')){const kind=action.split(':')[1];modal('历史版本对比',`<p class="small muted">11 月 02 日 18:40 → 当前草稿</p><div class="diff" style="margin-top:18px"><span class="del">− 认真回应每一次对话。</span><span class="add">+ 自然地参与聊天，能简短说清楚就不绕弯。<br>+ 安静也是一种选择。</span></div>`,btn('关闭','close','ghost')+btn('载入旧版草稿','restore:'+kind,'primary'));return}
if(action.startsWith('restore:')){const kind=action.split(':')[1];drafts[kind+'.text']=kind==='persona'?persona.replace('自然地参与聊天，能简短说清楚就不绕弯。\n不必接住每一句话，安静也是一种选择。','认真回应每一次对话。'):prompt.replace('读懂收到的观察，再决定参与、继续自己的事，或保持安静。','根据收到的观察，决定下一步行动。');closeModal();location.hash='/'+kind+'/'+(kind==='persona'?'core':'edit');render();toast('已载入示例版本到草稿，尚未保存。');return}
if(action.startsWith('memory:')){const i=Number(action.split(':')[1]),d=developments[i];modal(d[1],`${badge(d[0],'neutral')}<p style="margin-top:14px">${d[2]}</p><div class="divider"></div><h3>形成依据</h3><div class="callout small muted">来自对应聊天中的外部消息与反馈。此处为示例依据，不是实际聊天记录。</div><h3>修订记录</h3><p class="subtitle">${d[5]} · 当前版本<br>修改前的内容与依据将保留。</p>`,btn('删除…','forget:'+i,'danger')+btn('修正…','correct:'+i)+btn('关闭','close','ghost'));return}
if(action.startsWith('correct:')){const i=Number(action.split(':')[1]);modal('修正这条理解',note('修正会生成新版本，并中断正在进行的思考。'),btn('取消','close','ghost')+btn('继续预览修正','correct-edit:'+i,'primary'));return}
if(action.startsWith('correct-edit:')){const i=Number(action.split(':')[1]);modal('修正内容',`<textarea rows="5" aria-label="修正内容">${esc(developments[i][2])}</textarea><p class="subtitle">你的修正会成为新版本的依据。</p>`,btn('取消','close','ghost')+btn('模拟保存修正','simulate','primary'));return}
if(action.startsWith('forget:')){modal('删除影响预览',note('正式版会先列出这条记录及受影响的依赖记录，再确认删除。')+'<p class="small muted">此设计稿不连接数据库，不计算或删除实际记录。</p>',btn('取消','close','ghost')+btn('模拟确认删除','simulate','danger'));return}
if(action.startsWith('secret:')){const name=action.slice(7);modal(name?'更换凭据':'添加变量',`<div class="fields"><div class="field full"><label for="secret-name">环境变量名称</label><input id="secret-name" value="${esc(name)}" placeholder="MY_API_KEY"></div><div class="field full"><label for="secret-demo">新的凭据</label><input id="secret-demo" type="password" placeholder="演示输入，请勿填写真实密钥" autocomplete="off"></div></div><p class="subtitle">此处只演示填写和确认流程。</p>`,btn('取消','close','ghost')+btn('模拟保存','simulate','primary'));return}
if(action.startsWith('provider:')){const name=action.slice(9);modal(name?'编辑供应商':'添加供应商',`<div class="fields">${field('名称',name,'demo.provider')}${select('API 协议',['OpenAI Responses','OpenAI Chat Completions','Anthropic Messages'],'demo.api')}${field('接口地址','https://model.example.com/v1','demo.url','','',true)}${field('密钥环境变量','MODEL_API_KEY','demo.key','','',true)}</div>`,btn('取消','close','ghost')+btn('模拟保存','simulate','primary'));return}
if(action==='simulate'){closeModal();toast('已展示操作完成效果，没有写入任何实际数据。');return}
if(action.startsWith('test:')){modal('连接测试 · 示例结果',`<div class="connectionline">${icon('check')}测试成功${badge('模拟结果')}<span class="grow"></span><span class="mono">842 ms</span></div><p class="small muted">正式界面会发起实际请求。此设计稿只展示结果布局，不调用模型。</p>`);return}
if(action==='allow-visible'||action==='deny-visible'){perms.filter(p=>p.join(' ').toLowerCase().includes(query.toLowerCase())).forEach(p=>permissionState[p[0]]=action==='allow-visible');document.getElementById('permissions-body').innerHTML=permissionRows();toast('已更新筛选范围内的预览权限。');return}
if(action==='log-refresh'){toast('示例日志已刷新。');return}
if(action==='filter-events'){modal('事件筛选',`<div class="fields">${['环境事件','观察','她的文字','工具','行动','思考','系统'].map(t=>`<label class="row small"><input type="checkbox" checked>${t}</label>`).join('')}</div><p class="subtitle">本弹窗展示筛选控件；本页固定展示四条示例动态。</p>`);return}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.accent){applyAccent(b.dataset.accent);document.getElementById('theme-hex').value=currentAccent;document.getElementById('theme-hex').setAttribute('aria-invalid','false');document.getElementById('theme-error').textContent='';return}if(b.dataset.sub){location.hash='/'+route+'/'+b.dataset.sub;return}if(b.dataset.config){configSection=b.dataset.config;render();return}if(b.dataset.plugin){pluginState[b.dataset.plugin]=b.dataset.value;drafts['plugins.'+b.dataset.plugin]=b.dataset.value;if(!('plugins.'+b.dataset.plugin in baseline))baseline['plugins.'+b.dataset.plugin]='默认';render();if(b.dataset.plugin==='snowluma-tools'&&b.dataset.value==='关')toast('关闭 QQ 原生接口后，她将不能自己在 QQ 里发消息。');return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.action)handle(b.dataset.action)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='theme-picker'||el.id==='theme-hex'){const color=validAccent(el.value);const input=document.getElementById('theme-hex');input.setAttribute('aria-invalid',String(!color));document.getElementById('theme-error').textContent=color?'':'请输入 3 位或 6 位十六进制颜色，例如 #536FB5。';if(color)applyAccent(color);return}if(el.dataset.key){drafts[el.dataset.key]=el.type==='checkbox'?el.checked:el.value;updateDraftCount();if(el.classList.contains('editor')){const c=document.getElementById('charcount');if(c)c.textContent=el.value.length+' 字符'}if(el.dataset.key==='prompt.text'){document.getElementById('markerchecks').innerHTML=markerChecks()}}if(el.id==='development-search'){query=el.value;document.getElementById('development-list').innerHTML=developmentRows()}if(el.id==='permission-search'){query=el.value;document.getElementById('permissions-body').innerHTML=permissionRows()}if(el.dataset.permission){permissionState[el.dataset.permission]=el.checked;drafts['plugins.permission.'+el.dataset.permission]=el.checked;baseline['plugins.permission.'+el.dataset.permission]=true;updateDraftCount()}});
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const elements=[...m.querySelectorAll('button,input,select,textarea,a')].filter(el=>!el.disabled),first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
window.addEventListener('hashchange',navigate);window.addEventListener('popstate',()=>applyAccent(validAccent(new URL(location.href).searchParams.get('accent')||'')||originalAccent,false));navigate();if(new URL(location.href).searchParams.get('theme')==='open')openTheme();
</script></body></html>
